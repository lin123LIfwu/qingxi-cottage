<body><script type="module">
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;

      const m = o.material; stats.push({ file: f, mesh: o.name, tris: o.geometry.index.count / 3, mat: m.name, maps: ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap'].filter(k => m[k]).map(k => k + ':' + m[k].image.width + 'x' + m[k].image.height).join(' '), transparent: m.transparent }); }

else if (view === 'reel') { cam.position.set(0.48, 0.24, 0.72); cam.lookAt(0.6, 0.05, 0.3); cam.fov = 26; cam.updateProjectionMatrix(); }
